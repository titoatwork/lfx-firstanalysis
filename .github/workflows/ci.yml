name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # The entrypoint a reviewer is told to run, exercised exactly as documented in
  # the README: clone, install requirements, ./verify.sh. This job is what makes
  # the badge mean "the documented command works", not merely "the scripts run".
  reviewer-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies exactly as the README says
        run: pip install -r riscv-param-extraction/requirements.txt

      - name: Verify the executable bit survived the checkout
        run: test -x verify.sh

      - name: ./verify.sh
        run: ./verify.sh

  # Every number published in this repository must re-derive from a committed
  # artifact. If a figure in metrics.md, PRIMARY_RESULTS.md or the README stops
  # agreeing with the file it came from, this job fails and the badge goes red.
  published-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r riscv-param-extraction/requirements.txt

      - name: Every published number re-derives from a committed artifact
        run: python riscv-param-extraction/scripts/verify_claims.py

      - name: Claim table (for the run log)
        if: always()
        run: python riscv-param-extraction/scripts/verify_claims.py --list

  export-and-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riscv-param-extraction
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Evaluation fixtures and review-envelope separation
        env:
          PYTHONPATH: .
        run: python workflow_slice/scripts/ci_slice_check.py
