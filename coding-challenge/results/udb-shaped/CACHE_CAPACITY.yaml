# Candidate parameter, not present in riscv/riscv-unified-db today.
# Extracted from the snippet; offered for SIG review, not proposed upstream.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: CACHE_CAPACITY
long_name: cache capacity
description: |
  The capacity of a cache. The capacity and organization of a cache and the size
  of a cache block are all implementation-specific, and the execution
  environment provides software a means to discover them.

  Modeling note: treated as an axis independent of block size, since the snippet
  states no constraint tying their value spaces together. No such parameter
  exists upstream. Capacity is not observable to software through the CMO
  extensions themselves, which is a plausible reason it has not been modeled.
definedBy:
  extension:
    anyOf:
      - name: Zicbom
      - name: Zicbop
      - name: Zicboz
schema:
  type: integer
  minimum: 1
