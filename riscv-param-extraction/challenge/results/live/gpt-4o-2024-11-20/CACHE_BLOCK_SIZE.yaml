kind: parameter
name: CACHE_BLOCK_SIZE
long_name: Cache block size
description: |
  The size of a cache block, which is a contiguous, naturally aligned power-of-two
  (NAPOT) range of memory locations. The size of a cache block is
  implementation-specific, and the execution environment provides software a means
  to discover this information. In the initial set of CMO extensions, the size of a
  cache block shall be uniform throughout the system.
