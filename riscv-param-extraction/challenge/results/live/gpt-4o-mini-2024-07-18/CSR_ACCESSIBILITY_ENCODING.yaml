$schema: param_schema.json#
kind: parameter
name: CSR_ACCESSIBILITY_ENCODING
long_name: CSR Accessibility Encoding
description: |
  The upper 4 bits of the CSR address (csr[11:8]) are used to encode the read and
  write accessibility of the CSRs according to privilege level. The top two bits
  (csr[11:10]) indicate whether the register is read/write (00, 01, or 10) or
  read-only (11). The next two bits (csr[9:8]) encode the lowest privilege level
  that can access the CSR.
definedBy:
  extension:
    name: Sm
schema:
  type: string
