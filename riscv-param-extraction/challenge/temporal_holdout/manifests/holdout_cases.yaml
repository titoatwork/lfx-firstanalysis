# Preregistered temporal holdout — Artifact C pilot
# COMMIT THIS BEFORE any model outputs.
#
# Scope claim (defensible):
#   10 / 223 public UDB parameters ≈ 4.5% vertical pilot + 3 hard negatives.
#   NOT 5% of mentors' current internal pipeline (see UDB issue #2053 scope notes).
#
# Hypothesis:
#   Leakage-audited CSR/field context improves WARL detection and classification
#   vs source-excerpt-only baseline, under temporal separation from the fixed model.

schema_version: 1
pilot_id: temporal-holdout-artifact-c-v1
preregistered: true
preregistered_before_outputs: true

pins:
  model_id: gpt-4o-mini-2024-07-18
  model_release_date: "2024-07-18"
  model_note: >
    Fixed snapshot for both conditions. Knowledge/training cutoff is not fully
    public; temporal rule uses model *release date* vs UDB param first-add date.
  udb_repo: https://github.com/riscv/riscv-unified-db
  udb_sha: 5b7eccdebeb28d9a616434a4bcc5345e1f3f8939
  isa_manual_path: ext/riscv-isa-manual
  isa_manual_sha: 7fc198f13ad89e9608e9404be1c7a8119c14c13b
  temperature: 0
  prompt_version: holdout-v1

temporal_rule: >
  Positive cases must have UDB param YAML first-introduced (git --diff-filter=A
  on current path) strictly after pins.model_release_date. ISA Manual prose may
  be older; separation targets formal UDB parameter identity / gold YAML, not
  full pretraining of RISC-V text.

scale_claim: >
  10 positives of 223 public parameters (~4.5%) plus 3 hard negatives.
  Report raw counts and case table only — no grand statistical claims.

conditions:
  baseline:
    id: baseline
    description: Source excerpt only (no CSR/field context block).
  treatment:
    id: treatment
    description: >
      Source excerpt plus leakage-audited CSR/field context (no exact/normalized
      gold parameter names, no ground-truth YAML bodies).

metrics:
  - name_agnostic_detection   # gold param warranted? (existence / class signal)
  - exact_or_alias_name_recall
  - classification_accuracy   # WARL / CSR_RW / DIRECT / negative
  - warl_recall               # among WARL gold cases only
  - schema_validity           # emitted YAML parses + type present
  - quote_grounding           # evidence quote in source (baseline) or source∪context (treatment)
  - type_fidelity             # schema.type matches gold when present
  - negative_control_fp       # any param emitted on negatives = FP

