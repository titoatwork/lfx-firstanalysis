strata_counts:
  warl: 5
  csr_rw_or_wlrl: 2  # P06 CSR_RW + P07 WLRL
  direct: 3
  negatives: 3

leakage_gate:
  fail_closed: true
  forbid:
    - exact_parameter_name
    - normalized_parameter_name
    - ground_truth_yaml_content
  record:
    - source_shas
    - prompt_hash
    - context_hash

acceptance:
  - Manifest and gold committed before any live model output.
  - Leakage fixtures under fixtures/leaked must fail leak_scan.
  - CI runs unit tests + leak_scan + scorer on committed artifacts (no paid API).
  - Live baseline vs treatment uses identical model_id and temperature.
  - Null / negative treatment results published without hand-repair.
