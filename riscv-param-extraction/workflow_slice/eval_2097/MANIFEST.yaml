# Frozen adversarial evaluation pack for upstream skill PR #2097
# (docs: add extract-parameters-from-subsection agent skill)
#
# Mode: rule-level adversarial fixtures — no paid model required.
# Skill under review: uditjainstjis/riscv-unified-db @ feat/extract-parameters-skill
# Skill file: .agents/skills/extract-parameters-from-subsection/SKILL.md

pack_id: eval-2097-v2
target_pr: https://github.com/riscv/riscv-unified-db/pull/2097
target_issue: https://github.com/riscv/riscv-unified-db/issues/2096
evaluation_mode: rule_adversarial
paid_model_required: false

# v2 (2026-07-29). Three changes, all traceable to upstream commit 72d18f7 and
# the discussion on #2097:
#   1. Third case category `candidates`: text that should be extracted and then
#      classified out. v1 had only positives and negatives, so a candidate of
#      that shape had nowhere to sit and the validator would report a failure
#      that was not one.
#   2. NEG_WARL_FIXED_LEGAL_SET moved to candidates as CAND_WARL_FIXED_LEGAL_SET.
#      Its expect_params: 0 was right; its expect_extract: false encoded a
#      rejection gate that the skill's own two-artifact design argues against.
#   3. Recall-direction cases added. v1 tested over-firing only, while the
#      measured gap is under-firing: 63 conditional-writability sentences in
#      the manual carry no WARL/WLRL token against 5 that do.

checks:
  - evidence_excerpt_present
  - source_anchor_optional_but_recorded
  - duplicate_status_existing_or_new
  - definedBy_shape
  - schema_validity_udb_param  # clean param only, NOT the skill's parameters: wrapper
  - false_positive_on_negatives
  - warl_class_boundary_legal_values_vs_rw_vs_extension_gating
  - recall_on_conditional_writability_without_warl_token
  - review_envelope_vs_udb_yaml_separation

positives:
  - id: POS_DIRECT_CACHE_BLOCK
    class: NORM_DIRECT
    gold_name: CACHE_BLOCK_SIZE
    expect_signal: implementation-specific
    expect_status: existing
    path: cases/positives/POS_DIRECT_CACHE_BLOCK/

  - id: POS_DIRECT_NUM_PMP
    class: NORM_DIRECT
    gold_name: NUM_PMP_ENTRIES
    expect_signal: implementation-defined count
    expect_status: existing
    path: cases/positives/POS_DIRECT_NUM_PMP/

  - id: POS_CSR_RW_MTVEC_ACCESS
    class: NORM_CSR_RW
    gold_name: MTVEC_ACCESS
    expect_signal: may be read-only / writable
    expect_status: existing
    path: cases/positives/POS_CSR_RW_MTVEC_ACCESS/

  - id: POS_WARL_MTVEC_MODES
    class: NORM_CSR_WARL
    gold_name: MTVEC_MODES
    expect_signal: WARL legal set for MODE
    expect_status: existing
    path: cases/positives/POS_WARL_MTVEC_MODES/
    notes: >
      True WARL parameter: the legal MODE set is implementation-chosen, and
      UnifiedDB models it as MTVEC_MODES with schema {type: array, items:
      {enum: [0, 1]}, minItems: 1, maxItems: 2}. The set may collapse to one
      element because an implementation narrowed it, which is not the same as
      a value the ISA fixes; no parameter in spec/std/isa/param/ admits exactly
      one value. Note revised 2026-07-29: the earlier wording here asked the
      skill to check whether the legal set was ISA-fixed before emitting, which
      was a rejection gate. See CAND_WARL_FIXED_LEGAL_SET.

  - id: POS_WARL_ASID_WIDTH
    class: NORM_CSR_WARL
    gold_name: ASID_WIDTH
    expect_signal: UNSPECIFIED / ASIDLEN
    expect_status: existing
    path: cases/positives/POS_WARL_ASID_WIDTH/

  - id: POS_RECALL_COUNT_GEILEN
    class: NORM_DIRECT
    gold_name: NUM_EXTERNAL_GUEST_INTERRUPTS
    expect_signal: implementation-chosen count reached through conditional writability
    expect_status: existing
    path: cases/positives/POS_RECALL_COUNT_GEILEN/
    notes: >
      Recall control. Contains no WARL or WLRL token, so a token-gated signal
      list misses it. The writability of hstatus.VGEIN follows the value of a
      count, not a legal-value set and not a plain mutability predicate, so the
      parameter to surface is the count itself.

candidates:
  # Text that must be surfaced and then classified out. Distinct from negatives,
  # which must not be surfaced at all.
  - id: CAND_WARL_FIXED_LEGAL_SET
    kind: warl_word_but_isa_fixed
    expect_extract: true
    expect_params: 0
    path: cases/candidates/CAND_WARL_FIXED_LEGAL_SET/
    skill_risk: >
      A WARL field whose legal set is fixed by the ISA for every implementation
      yields no UnifiedDB parameter, but dropping it at extraction hides it from
      the human gate the skill relies on. The envelope has no axis that records
      "the ISA fixes the set": classification is named + config_dependent, so
      this emits identically to a genuine free-standing parameter.

negatives:
  - id: NEG_FIXED_ENCODING
    kind: fixed_csr_encoding
    expect_params: 0
    path: cases/negatives/NEG_FIXED_ENCODING/
    skill_risk: >
      "by convention" / fixed address mapping must not become parameters
      even if technical.

  - id: NEG_SOFTWARE_ADVICE
    kind: non_normative_or_software_advice
    expect_params: 0
    path: cases/negatives/NEG_SOFTWARE_ADVICE/
    skill_risk: >
      "should"/"may" in software/compiler advice — skill contextual
      optionally/may rules can over-fire without a hardware config choice.

  - id: NEG_SHALL_NO_DELEGATION
    kind: normative_no_implementation_choice
    expect_params: 0
    path: cases/negatives/NEG_SHALL_NO_DELEGATION/
    skill_risk: >
      Pure shall/must constraints without implementation-defined choice
      are not parameters.

  - id: NEG_EXT_GATED_PBMTE
    kind: conditional_writability_but_extension_gated
    expect_params: 0
    path: cases/negatives/NEG_EXT_GATED_PBMTE/
    skill_risk: >
      "is read-only zero" phrasing carries no WARL token, so a token-gated
      signal list misses it, but a rule that admits all such phrasing as a
      legal-value parameter over-fires on extension gating. In UnifiedDB,
      menvcfg.PBMTE carries definedBy {extension: {name: Svpbmt}} and no
      type() at all, and no PBMTE parameter exists. At least 19 of the 63
      conditional-writability sentences in the manual are of this shape.

skill_structural_critiques:
  - id: WRAPPER_NOT_UDB_FILE
    severity: high
    detail: >
      Output shape uses top-level parameters: list plus excerpt/source/
      classification/status. That is a review envelope, not a file that
      validates as param_schema.json (no kind/$schema/long_name/description
      required fields; wrapper key is an additionalProperty).

  - id: WARL_CLASS_BOUNDARY
    severity: high
    superseded: WARL_ALWAYS_POSITIVE
    detail: >
      Revised 2026-07-29 after upstream 72d18f7. The original critique asked the
      skill to require that the legal value set be implementation-chosen before
      accepting a WARL candidate. That was the wrong instrument: it is a
      rejection gate, and the skill's two-artifact design filters at human
      review instead. The residual defect is a class boundary, not a gate.
      Conditional writability resolves three ways and the skill assigns one:
      an extension being absent is not a parameter (definedBy); a condition on
      a legal-value set's cardinality is NORM_CSR_WARL, as vsstatus.UXL shows
      with type() = $array_size(VUXLEN) > 1 ? RW : RO; a plain predicate is
      NORM_CSR_RW, as the *_MODE_ENDIANNESS and HPM_COUNTER_EN parameters show.
      The envelope has no key that can record which of the three applies.

  - id: TAXONOMY_SELF_INCONSISTENT
    severity: high
    filed_upstream: https://github.com/riscv/riscv-unified-db/issues/2200
    detail: >
      Upstream of both the skill and this pack. taxonomy.md (PR #1766) defines
      NORM_CSR_WARL as "the spec describes a CSR field as WARL and the legal
      values are implementation-defined", while its decision tree at step 4 asks
      only whether the text describes a WARL field's legal values, and step 4 is
      evaluated before step 5, the NORM_CSR_RW test. The NORM_CSR_RW class
      definition names "MBE, SBE, and UBE bits in mstatus are WARL fields" as
      its own example, so the same excerpt classifies differently depending on
      which half a reader uses, and the document states no precedence between
      them while requiring exactly one class per parameter.
      UnifiedDB settles this case against the decision tree: mstatus.MBE has
      type() = M_MODE_ENDIANNESS == "dynamic" ? RW : RO with no sw_write at all,
      and M_MODE_ENDIANNESS is {type: string, enum: [little, big, dynamic]},
      which is the taxonomy's value type `enum` rather than `set`.
      The skill also never names the taxonomy or any of its eight classes, so
      its instruction to use "one of the classifications used by the UnifiedDB
      schema" and the escape hatch is not resolvable from the skill alone.

  - id: COMPARE_BY_NAME_AND_MEANING
    severity: medium
    detail: >
      "Compare by name and by meaning" for existing/new is underspecified.
      Renames and conceptual duplicates need explicit alias/alignment rules
      (Part I used curated one-to-many groups).

  - id: DEFINEDBY_FROM_SUBSECTION
    severity: medium
    detail: >
      Inferring definedBy solely from the subsection's owning extension
      is unsafe when a parameter is gated by multiple extensions or by
      another parameter (e.g. CMO anyOf; PMP usable count gated by NUM_PMP).

  - id: NO_NEGATIVE_CONTROLS_OR_VALIDATOR
    severity: high
    detail: >
      Skill provides worked examples but no adversarial negatives, no
      automated schema check on emitted candidates, and no required
      separation of review metadata from mergeable UDB YAML.
