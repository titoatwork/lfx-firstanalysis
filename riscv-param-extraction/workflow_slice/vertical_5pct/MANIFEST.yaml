# 5% vertical slice: evidence → review envelope → (optional) clean UDB YAML
# Frozen decisions — another contributor must reproduce without trusting us.
# No bulk PR; no paid model required for this package.

slice_id: vertical-5pct-v1
source_udb_commit: 2307e29b70f1a1f482da282f682062c6aa68e71d
source_udb_note: local riscv-unified-db tip used for schema/param gold cross-check
paid_model_required: false

pipeline:
  - spec_evidence
  - candidate
  - duplicate_decision
  - human_review_record
  - validated_udb_yaml_if_approved
  - pr_ready_package_shape

rules:
  - review_envelope never mixed into param.yaml
  - param.yaml emitted only when decision is approve_export
  - reject cases have review_envelope only
  - needs_more_evidence cases have review_envelope only, and must list what
    evidence would resolve them
  - every decision cites exact excerpt + source pin
  - an evidence_type is a claim about a tree, so it carries the pin it was
    determined against; where revisions disagree, both are recorded

candidates:
  - id: C01_CACHE_BLOCK_SIZE
    path: candidates/C01_CACHE_BLOCK_SIZE/
    class: NORM_DIRECT
    decision: approve_export
    duplicate_status: existing
    notes: clean DIRECT parameter; multi-extension definedBy (anyOf)

  - id: C02_NUM_PMP_ENTRIES
    path: candidates/C02_NUM_PMP_ENTRIES/
    class: NORM_DIRECT
    decision: approve_export
    duplicate_status: existing
    notes: implementation-defined count with architectural enum constraints

  - id: C03_MTVEC_MODES
    path: candidates/C03_MTVEC_MODES/
    class: NORM_CSR_WARL
    decision: approve_export
    duplicate_status: existing
    notes: true WARL — legal MODE *set* is implementation-chosen

  - id: C04_ASIDLEN_TO_ASID_WIDTH
    path: candidates/C04_ASIDLEN_TO_ASID_WIDTH/
    class: NORM_CSR_WARL
    decision: approve_export
    duplicate_status: existing
    notes: >
      WARL/width rename-dedup exercise. Spec term ASIDLEN maps to existing
      UDB name ASID_WIDTH; must not open a second parameter.

  - id: C05_REJECT_MTVEC_MODE_ENCODING
    path: candidates/C05_REJECT_MTVEC_MODE_ENCODING/
    class: CSR_FIELD_NOT_PARAM
    decision: reject
    duplicate_status: not_applicable
    notes: >
      MODE value encodings 0/1 are ISA-fixed field semantics, not an
      implementation-defined architectural parameter. Hard judgment case.

  # Added 2026-08-05. The first five cases exercise approve and one kind of
  # reject. These three cover the dispositions that were still unbuilt: a
  # derived quantity, a case whose evidence depends on which commit is read,
  # and an honest abstention. All three are drawn from candidates that two
  # models proposed as new parameters at high confidence, so they are real
  # failures of dual-model agreement rather than invented fixtures.
  - id: C06_REJECT_IALIGN_DERIVED
    path: candidates/C06_REJECT_IALIGN_DERIVED/
    class: DERIVED_NOT_PARAM
    decision: reject
    duplicate_status: not_applicable
    evidence_type: executable
    evidence_type_pin: both
    notes: >
      Config-dependent and named in the specification, so every surface signal
      says parameter. `function ialign` in globals.isa settles it. The one case
      here that an automated derivation sweep can find without a human.

  - id: C07_FLEN_PIN_DEPENDENT
    path: candidates/C07_FLEN_PIN_DEPENDENT/
    class: DERIVED_NOT_PARAM
    decision: reject
    duplicate_status: not_applicable
    evidence_type: executable
    evidence_type_pin: main_only
    evidence_type_at_corpus_pin: documented
    notes: >
      Same disposition at both revisions, different evidence. `U32 FLEN = 64;`
      at the corpus pin, a config-dependent global on main after #1813. The
      project published the corpus-pin reading as a fact about UDB, which is
      the mistake this fixture pins.

  - id: C08_ILEN_INSUFFICIENT
    path: candidates/C08_ILEN_INSUFFICIENT/
    class: UNRESOLVED
    decision: needs_more_evidence
    duplicate_status: not_applicable
    evidence_type: absent
    evidence_type_pin: both
    notes: >
      Used in a Ziccif constraint, defined nowhere, at either revision and
      under both derivation forms. Neither approved nor rejected, and no
      param.yaml. The abstention is the result.
