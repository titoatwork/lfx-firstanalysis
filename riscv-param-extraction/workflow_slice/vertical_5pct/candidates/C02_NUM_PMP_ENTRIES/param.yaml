$schema: param_schema.json#
kind: parameter
name: NUM_PMP_ENTRIES
long_name: Number of implemented PMP entries
description: |
  Number of implemented PMP entries. The architecture mandates that the number
  of implemented PMP registers must appear to be 0, 16, or 64. The number of
  implemented PMP entries is implementation-defined within those architectural
  constraints.
definedBy:
  extension:
    name: Sm
schema:
  type: integer
  enum: [0, 16, 64]
