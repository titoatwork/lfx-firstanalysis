# Clean UDB-shaped parameter YAML — review metadata stripped.
# yaml-language-server: $schema=../../../../export/schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: MTVEC_MODES
long_name: Modes supported by mtvec.MODE
description: |
  Options:

    0::
      Direct; All traps set pc to mtvec.BASE
    1::
      Vectored; Asynchronous interrupts set pc to mtvec.BASE + 4 x cause.

  If only one mode is given, mtvec.MODE is assumed to be read-only with that value.
  Otherwise, mtvec.MODE is read-write. The legal set is implementation-chosen
  among the architecturally defined encodings.
definedBy:
  extension:
    name: Sm
schema:
  type: array
  items:
    type: integer
    enum: [0, 1]
  minItems: 1
  maxItems: 2
  uniqueItems: true
