candidate_id: C03_MTVEC_MODES
pipeline_stage: human_review_record

evidence:
  excerpt: >-
    The mtvec register is an MXLEN-bit WARL read/write register that holds
    trap vector configuration, consisting of a vector base address (BASE)
    and a vector mode (MODE). If mtvec is writable, the set of values the
    register may hold can vary by implementation.
  source_file: ext/riscv-isa-manual/src/priv/machine.adoc
  source_commit_pin: 2307e29b70f1a1f482da282f682062c6aa68e71d
  subsection: Machine Trap-Vector Base-Address (mtvec) Register
  anchor: norm:mtvec_sz_warl_acc

classification:
  class: NORM_CSR_WARL
  named: false
  config_dependent: true
  uncertainty: null
  rationale: >
    True WARL parameter: the *set of legal MODE values* is
    implementation-chosen (subset of {0,1}; values ≥2 reserved). Distinct
    from mere presence of the word WARL on a field with a fully fixed legal set.

